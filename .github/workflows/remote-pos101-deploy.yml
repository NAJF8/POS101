name: Remote POS101 deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[remote-deploy]')
    runs-on: ubuntu-latest
    env:
      VITE_POS101_API_KEY: AIzaSyDtzonzkDsEvF9KNXi70j6ZTXG5kLAM_0c
      VITE_POS101_AUTH_DOMAIN: cmms-37512.firebaseapp.com
      VITE_POS101_DATABASE_URL: https://cmms-37512-default-rtdb.asia-southeast1.firebasedatabase.app
      VITE_POS101_PROJECT_ID: cmms-37512
      VITE_POS101_STORAGE_BUCKET: cmms-37512.firebasestorage.app
      VITE_POS101_MESSAGING_SENDER_ID: "451592788539"
      VITE_POS101_APP_ID: "1:451592788539:web:d3dc3e68b1543996b39a1e"
      VITE_POS101_KIOSK_WORKER_URL: https://pos101-kiosk-auth.coffee101.workers.dev
      VITE_FIREBASE_API_KEY: AIzaSyCzmUhkN29ey7B1BpexJvgh8miI2RlAn74
      VITE_FIREBASE_AUTH_DOMAIN: acc-101.firebaseapp.com
      VITE_FIREBASE_DATABASE_URL: https://acc-101-default-rtdb.europe-west1.firebasedatabase.app
      VITE_FIREBASE_PROJECT_ID: acc-101
      VITE_FIREBASE_STORAGE_BUCKET: acc-101.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1027289206201"
      VITE_FIREBASE_APP_ID: "1:1027289206201:web:3c58deb7fe132066723a68"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify exact main and Firebase environment
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          node scripts/central-firebase-regression.mjs --env
      - run: npm run test:report-open-orders
      - run: npm run test:comprehensive-report
      - run: node scripts/central-firebase-regression.mjs
      - run: node scripts/ui-hardening-regression.mjs
      - run: node scripts/stale-cache-regression.mjs
      - run: node scripts/staff-eligibility-regression.mjs
      - run: node scripts/sales-sync-queue-regression.mjs
      - run: node scripts/expense-business-date-regression.mjs
      - run: node scripts/expense-edit-delete-regression.mjs
      - run: node scripts/expense-ui-regression.mjs
      - run: node scripts/operational-day-close-regression.mjs
      - run: node scripts/pre-close-reconciliation-regression.mjs
      - run: node scripts/closed-day-report-regression.mjs
      - run: node scripts/settlement-correction-regression.mjs
      - run: node scripts/financial-center-regression.mjs
      - run: node scripts/comprehensive-report-regression.mjs
      - run: git diff --check
      - name: Remove any stale build output
        shell: bash
        run: rm -rf dist
      - name: Build exact deployed version
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - run: node scripts/central-firebase-regression.mjs --build
      - name: Verify generated deploy metadata
        shell: bash
        run: |
          test "$(node -e "console.log(require('./dist/deploy-meta.json').mainSha)")" = "$GITHUB_SHA"
          test -f dist/sw.js
          grep -Fq "$GITHUB_SHA" dist/sw.js
      - name: Deploy dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/pos101-gh-pages gh-pages
          find /tmp/pos101-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. /tmp/pos101-gh-pages/
          cd /tmp/pos101-gh-pages
          git add -A
          git commit -m "deploy: POS101 remote update"
          git push origin gh-pages
      - name: Verify live exact commit and bundle
        shell: bash
        run: |
          bundle="$(grep -o 'assets/index-[^\"]*\.js' dist/index.html | head -n 1)"
          bundle_name="${bundle#assets/}"
          for attempt in $(seq 1 24); do
            live_html="$(curl -fsSL "https://najf8.github.io/POS101/index.html?sha=$GITHUB_SHA" || true)"
            live_meta="$(curl -fsSL "https://najf8.github.io/POS101/deploy-meta.json?sha=$GITHUB_SHA" || true)"
            if printf '%s' "$live_html" | grep -Fq "$bundle" && printf '%s' "$live_meta" | grep -Fq "\"mainSha\": \"$GITHUB_SHA\"" && printf '%s' "$live_meta" | grep -Fq "\"bundle\": \"$bundle_name\""; then
              live_js="$(curl -fsSL "https://najf8.github.io/POS101/$bundle?sha=$GITHUB_SHA")"
              printf '%s' "$live_js" | grep -Fq "$VITE_POS101_DATABASE_URL"
              printf '%s' "$live_js" | grep -Fq 'pos101_staff'
              echo "EXACT_MAIN_DEPLOY=PASS"
              exit 0
            fi
            sleep 15
          done
          echo "EXACT_MAIN_DEPLOY=FAIL"
          exit 1
# remote deploy trigger 3
