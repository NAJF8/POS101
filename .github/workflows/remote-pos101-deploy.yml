name: Remote POS101 deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[remote-deploy]')
    runs-on: ubuntu-latest
    env:
      VITE_POS101_API_KEY: AIzaSyDtzonzkDsEvF9KNXi70j6ZTXG5kLAM_0c
      VITE_POS101_AUTH_DOMAIN: cmms-37512.firebaseapp.com
      VITE_POS101_DATABASE_URL: https://cmms-37512-default-rtdb.asia-southeast1.firebasedatabase.app
      VITE_POS101_PROJECT_ID: cmms-37512
      VITE_POS101_STORAGE_BUCKET: cmms-37512.firebasestorage.app
      VITE_POS101_MESSAGING_SENDER_ID: "451592788539"
      VITE_POS101_APP_ID: "1:451592788539:web:d3dc3e68b1543996b39a1e"
      VITE_POS101_KIOSK_WORKER_URL: https://pos101-kiosk-auth.coffee101.workers.dev
      VITE_FIREBASE_API_KEY: AIzaSyCzmUhkN29ey7B1BpexJvgh8miI2RlAn74
      VITE_FIREBASE_AUTH_DOMAIN: acc-101.firebaseapp.com
      VITE_FIREBASE_DATABASE_URL: https://acc-101-default-rtdb.europe-west1.firebasedatabase.app
      VITE_FIREBASE_PROJECT_ID: acc-101
      VITE_FIREBASE_STORAGE_BUCKET: acc-101.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1027289206201"
      VITE_FIREBASE_APP_ID: "1:1027289206201:web:3c58deb7fe132066723a68"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify exact main and Firebase environment
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          node scripts/central-firebase-regression.mjs --env
      - run: npm run test:report-open-orders
      - run: npm run test:comprehensive-report
      - run: node scripts/central-firebase-regression.mjs
      - run: node scripts/ui-hardening-regression.mjs
      - run: node scripts/stale-cache-regression.mjs
      - run: npm run test:operational-day-central-realtime
      - run: node scripts/staff-eligibility-regression.mjs
      - run: node scripts/sales-sync-queue-regression.mjs
      - run: node scripts/expense-business-date-regression.mjs
      - run: node scripts/expense-edit-delete-regression.mjs
      - run: node scripts/expense-ui-regression.mjs
      - run: npm run test:sale-edit
      - run: npm run test:sale-edit-modal
      - run: npm run test:backup-sales-recovery
      - run: npm run test:pending-diagnostics
      - run: npm run test:remote-reconcile
      - run: node scripts/operational-day-close-regression.mjs
      - run: node scripts/pre-close-reconciliation-regression.mjs
      - run: node scripts/closed-day-report-regression.mjs
      - run: node scripts/settlement-correction-regression.mjs
      - run: node scripts/financial-center-regression.mjs
      - run: node scripts/comprehensive-report-regression.mjs
      - run: git diff --check
      - name: Remove any stale build output
        shell: bash
        run: rm -rf dist
      - name: Build exact deployed version
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_TEMP_OPEN_ONE_BUTTON_REPAIR: 'true'
        run: npm run build
      - run: node scripts/central-firebase-regression.mjs --build
      - name: Verify generated deploy metadata
        shell: bash
        run: |
          test "$(node -e "console.log(require('./dist/deploy-meta.json').mainSha)")" = "$GITHUB_SHA"
          test -f dist/sw.js
          grep -Fq "$GITHUB_SHA" dist/sw.js
      - name: Deploy dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/pos101-gh-pages gh-pages
          find /tmp/pos101-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. /tmp/pos101-gh-pages/
          cd /tmp/pos101-gh-pages
          git add -A
          git commit -m "deploy: POS101 remote update"
          git push origin gh-pages
      - name: Verify live exact commit and bundle
        shell: bash
        run: |
          set +e
          base_url="https://najf8.github.io/POS101"
          expected_main_sha="$GITHUB_SHA"
          expected_bundle="$(node -e "process.stdout.write(require('./dist/deploy-meta.json').bundle || '')")"
          bundle_path="assets/$expected_bundle"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          if [ -z "$expected_bundle" ] || ! grep -F "$bundle_path" dist/index.html > /dev/null; then
            echo "EXPECTED_MAIN_SHA=$expected_main_sha"
            echo "EXPECTED_BUNDLE=$expected_bundle"
            echo "ACTUAL_LIVE_MAIN_SHA="
            echo "ACTUAL_LIVE_BUNDLE="
            echo "EXPECTED_BUNDLE_HTTP=NOT_CHECKED"
            echo "FAILURE_CAUSE=local_expected_bundle_missing_or_not_referenced"
            echo "VERIFICATION_URL_CORRECT=YES ($base_url/)"
            echo "RETRY_LOGIC_FIXED=YES"
            exit 1
          fi

          actual_main_sha=""
          actual_bundle=""
          expected_bundle_http="000"
          failure_cause="propagation_or_live_content_mismatch"
          for attempt in $(seq 1 45); do
            cache_query="sha=${expected_main_sha}&attempt=${attempt}"
            html_file="$tmp_dir/index.html"
            meta_file="$tmp_dir/deploy-meta.json"
            js_file="$tmp_dir/$expected_bundle"
            html_status="$(curl --connect-timeout 10 --max-time 30 -sS -o "$html_file" -w '%{http_code}' "$base_url/index.html?$cache_query")"
            meta_status="$(curl --connect-timeout 10 --max-time 30 -sS -o "$meta_file" -w '%{http_code}' "$base_url/deploy-meta.json?$cache_query")"
            actual_main_sha=""
            actual_bundle=""
            if [ "$meta_status" = "200" ]; then
              actual_main_sha="$(LIVE_META_FILE="$meta_file" node -e "try { const m=JSON.parse(require('fs').readFileSync(process.env.LIVE_META_FILE,'utf8')); process.stdout.write(m.mainSha || '') } catch {}")"
              actual_bundle="$(LIVE_META_FILE="$meta_file" node -e "try { const m=JSON.parse(require('fs').readFileSync(process.env.LIVE_META_FILE,'utf8')); process.stdout.write(m.bundle || '') } catch {}")"
            fi
            expected_bundle_http="000"
            if [ "$html_status" = "200" ] && [ "$meta_status" = "200" ]; then
              expected_bundle_http="$(curl --connect-timeout 10 --max-time 30 -sS -o "$js_file" -w '%{http_code}' "$base_url/$bundle_path?$cache_query")"
            fi
            html_has_bundle=NO
            js_has_firebase=NO
            js_has_staff=NO
            if [ "$html_status" = "200" ] && grep -F "$bundle_path" "$html_file" > /dev/null 2>&1; then html_has_bundle=YES; fi
            if [ "$expected_bundle_http" = "200" ] && grep -F "$VITE_POS101_DATABASE_URL" "$js_file" > /dev/null 2>&1; then js_has_firebase=YES; fi
            if [ "$expected_bundle_http" = "200" ] && grep -F 'pos101_staff' "$js_file" > /dev/null 2>&1; then js_has_staff=YES; fi
            echo "VERIFY_ATTEMPT=$attempt HTML_HTTP=$html_status META_HTTP=$meta_status BUNDLE_HTTP=$expected_bundle_http ACTUAL_MAIN_SHA=$actual_main_sha ACTUAL_BUNDLE=$actual_bundle HTML_BUNDLE=$html_has_bundle"

            if [ "$actual_main_sha" = "$expected_main_sha" ] && [ "$actual_bundle" = "$expected_bundle" ] && [ "$html_has_bundle" = YES ] && [ "$expected_bundle_http" = 200 ] && [ "$js_has_firebase" = YES ] && [ "$js_has_staff" = YES ]; then
              echo "EXPECTED_MAIN_SHA=$expected_main_sha"
              echo "EXPECTED_BUNDLE=$expected_bundle"
              echo "ACTUAL_LIVE_MAIN_SHA=$actual_main_sha"
              echo "ACTUAL_LIVE_BUNDLE=$actual_bundle"
              echo "EXPECTED_BUNDLE_HTTP=$expected_bundle_http"
              echo "FAILURE_CAUSE=NONE"
              echo "VERIFICATION_URL_CORRECT=YES ($base_url/)"
              echo "RETRY_LOGIC_FIXED=YES"
              echo "EXACT_MAIN_DEPLOY=PASS"
              exit 0
            fi
            if [ "$actual_main_sha" != "$expected_main_sha" ]; then failure_cause="stale_or_unavailable_deploy_meta"; fi
            if [ "$actual_bundle" != "$expected_bundle" ] || [ "$html_has_bundle" != YES ]; then failure_cause="stale_index_or_bundle_propagation"; fi
            if [ "$expected_bundle_http" != 200 ]; then failure_cause="expected_bundle_not_available_or_wrong_path"; fi
            sleep 20
          done

          echo "EXPECTED_MAIN_SHA=$expected_main_sha"
          echo "EXPECTED_BUNDLE=$expected_bundle"
          echo "ACTUAL_LIVE_MAIN_SHA=$actual_main_sha"
          echo "ACTUAL_LIVE_BUNDLE=$actual_bundle"
          echo "EXPECTED_BUNDLE_HTTP=$expected_bundle_http"
          echo "FAILURE_CAUSE=$failure_cause"
          echo "VERIFICATION_URL_CORRECT=YES ($base_url/)"
          echo "RETRY_LOGIC_FIXED=YES"
          echo "EXACT_MAIN_DEPLOY=FAIL"
          exit 1
# remote deploy trigger 3
